name = "lead-webhook-worker"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Domain frontend được phép gọi vào Worker (đổi thành domain thật khi deploy production)
ALLOWED_ORIGIN = "https://palm-river.vercel.app/"
# Bật rate limit đơn giản trong bộ nhớ Worker (không bắt buộc, có thể để true/false)
ENABLE_RATE_LIMIT = "true"

# GOOGLE_SHEET_URL KHÔNG khai báo ở đây.
# Phải set bằng lệnh: npx wrangler secret put GOOGLE_SHEET_URL
# để không bao giờ nằm trong source code / git.